name: Manual Release with Commit Messages

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get commit messages since last tag
        id: commit_msgs
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "LAST_TAG=${LAST_TAG}" >> $GITHUB_OUTPUT
          
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -n 50)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          
          if [ -z "$COMMITS" ]; then
            COMMITS="- 无新提交"
          fi
          
          echo "MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            toggleHDR.lua
            toggleHDR.conf
            toggleHDR/**
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## ⭐ [![GitHub downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${{ github.event.inputs.version }}/total?cacheSeconds=300)](https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }})

            ### 更新内容
            ${{ steps.commit_msgs.outputs.MSG }}

            ${{ steps.commit_msgs.outputs.LAST_TAG && format('**完整更新日志**：[{0}...{1}]({2}/{3}/compare/{0}...{1})', steps.commit_msgs.outputs.LAST_TAG, github.event.inputs.version, github.server_url, github.repository) || '' }}
